<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>간단한 채팅창</title>
    <link rel="stylesheet" href="" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .chat-container {
        width: 350px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        background-color: #007bff;
        color: white;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .chat-messages {
        height: 400px;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background-color: #fafafa;
      }
      .message {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 15px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
      }
      .message.user {
        align-self: flex-end;
        background-color: #007bff;
        color: white;
        border-bottom-right-radius: 3px;
      }
      .message.bot {
        align-self: flex-start;
        background-color: #e4e6eb;
        color: black;
        border-bottom-left-radius: 3px;
      }
      .chat-input-container {
        display: flex;
        padding: 12px;
        background-color: #fff;
        border-top: 1px solid #ddd;
      }
      .chat-input {
        flex-grow: 1;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 20px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      .chat-input:focus {
        border-color: #007bff;
      }
      .send-btn {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin-left: 10px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        transition: background-color 0.2s;
      }
      .send-btn:hover {
        background-color: #0056b3;
      }
      .connect-btn {
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 15px;
        padding: 5px 15px;
        font-size: 13px;
        cursor: pointer;
        margin-top: 8px;
        transition: background-color 0.2s;
      }
      .connect-btn:hover {
        background-color: #218838;
      }
      .connect-btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        실시간 채팅<br />
        <button class="connect-btn" id="connect-human-btn">
          사람과 대화하기
        </button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message bot">
          안녕하세요! 테스트용 채팅창입니다. 메시지를 입력해 보세요.
        </div>
      </div>
      <div class="chat-input-container">
        <input
          type="text"
          class="chat-input"
          id="chat-input"
          placeholder="메시지 입력..."
        />
        <button class="send-btn" id="send-btn">➤</button>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="chat_ai.js"></script>
  </body>
</html>

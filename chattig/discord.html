<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>디스코드 채팅룸</title>
    <style>
      :root {
        --bg-primary: #313338;
        --bg-secondary: #2b2d31;
        --bg-tertiary: #1e1f22;
        --text-normal: #dbdee1;
        --text-muted: #949ba4;
        --brand: #5865f2;
        --brand-hover: #4752c4;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-normal);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      /* 왼쪽 서버 리스트 */
      .server-nav {
        width: 72px;
        background-color: var(--bg-tertiary);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 12px;
      }
      .server-icon {
        width: 48px;
        height: 48px;
        background-color: var(--bg-primary);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 8px;
      }
      .server-icon.active,
      .server-icon:hover {
        border-radius: 16px;
        background-color: var(--brand);
        color: white;
      }
      /* 중간 채널 리스트 */
      .channel-nav {
        width: 240px;
        background-color: var(--bg-secondary);
        display: flex;
        flex-direction: column;
      }
      .channel-header {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        font-weight: bold;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .channel-list {
        padding: 16px 8px;
      }
      .channel-item {
        padding: 8px;
        margin-bottom: 2px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-muted);
      }
      .channel-item:hover {
        background-color: rgba(78, 80, 88, 0.3);
        color: var(--text-normal);
      }
      .channel-item.active {
        background-color: rgba(78, 80, 88, 0.6);
        color: white;
      }
      /* 우측 메인 채팅 영역 */
      .chat-main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-primary);
      }
      .chat-topbar {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--bg-tertiary);
        font-weight: bold;
      }
      .copy-link-btn,
      .connect-btn {
        margin-left: auto;
        background-color: var(--brand);
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.2s;
        margin-left: 10px;
      }
      .copy-link-btn:hover,
      .connect-btn:hover {
        background-color: var(--brand-hover);
      }
      .connect-btn:disabled {
        background-color: var(--text-muted);
        cursor: not-allowed;
      }
      /* 채팅 메시지 영역 */
      .chat-messages {
        flex-grow: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        display: flex;
        flex-direction: column;
        color: var(--text-normal);
        line-height: 1.5;
        word-wrap: break-word;
      }
      /* chat_ai.js 클래스를 디스코드 스타일에 맞게 덮어쓰기 */
      .message.user::before {
        content: "나 (User)";
        font-size: 14px;
        color: #5865f2;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .message.bot::before {
        content: "상대방 (Other)";
        font-size: 14px;
        color: #da373c;
        font-weight: bold;
        margin-bottom: 4px;
      }
      /* 입력창 영역 */
      .chat-input-container {
        padding: 0 16px 24px 16px;
      }
      .chat-input-wrapper {
        background-color: #383a40;
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 10px 16px;
      }
      .chat-input {
        flex-grow: 1;
        background: transparent;
        border: none;
        color: var(--text-normal);
        font-size: 15px;
        outline: none;
      }
      .send-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 18px;
      }
      .send-btn:hover {
        color: var(--text-normal);
      }
    </style>
  </head>
  <body>
    <!-- 서버 네비게이션 -->
    <div class="server-nav">
      <div class="server-icon active">D</div>
      <div class="server-icon">+</div>
    </div>

    <!-- 채널 네비게이션 -->
    <div class="channel-nav">
      <div class="channel-header">우리들의 모임 서버</div>
      <div class="channel-list">
        <div class="channel-item active"># 일반-채팅방</div>
        <div class="channel-item"># 공지사항</div>
        <a href="chat_ai.html" style="text-decoration: none; color: inherit">
          <div class="channel-item" style="margin-top: 20px">
            ⬅️ 이전 화면으로
          </div>
        </a>
      </div>
    </div>

    <!-- 메인 채팅 영역 -->
    <div class="chat-main">
      <div class="chat-topbar">
        <span># 일반-채팅방</span>
        <!-- 초대 링크를 복사하는 버튼 -->
        <button class="copy-link-btn" onclick="copyInviteLink()">
          🔗 초대 링크 복사
        </button>
        <button class="connect-btn" id="connect-human-btn">서버 접속</button>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message bot">
          디스코드 테마 채팅방에 오신 것을 환영합니다! 우측 상단 '서버 접속'을
          눌러주세요.
        </div>
      </div>

      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <input
            type="text"
            class="chat-input"
            id="chat-input"
            placeholder="#일반-채팅방에 메시지 보내기"
          />
          <button class="send-btn" id="send-btn">➤</button>
        </div>
      </div>
    </div>

    <script>
      // 현재 페이지의 주소를 클립보드에 복사하는 함수
      function copyInviteLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
          alert(
            "초대 링크가 복사되었습니다!\n다른 브라우저나 창에 붙여넣어 접속해보세요.\n" +
              url,
          );
        });
      }
    </script>

    <!-- 기존 채팅 기능 스크립트를 그대로 사용 -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="chat_ai.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 — 할래말래</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <button class="back-btn" onclick="history.back()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        <div class="logo">게시글</div>
        <div class="header-actions" id="headerActions"></div>
      </div>
    </header>
    <main class="container">
      <div id="detailPage"></div>
      <div id="commentSection" class="comment-section" style="display: none">
        <div class="comment-title-row">
          <span class="comment-title">댓글</span>
          <span class="comment-count-badge" id="commentCountBadge">0</span>
        </div>
        <div id="commentList" class="comment-list"></div>
        <div class="comment-input-row">
          <input
            id="commentInput"
            class="comment-input"
            placeholder="댓글을 입력하세요..."
          />
          <button id="commentSubmit" class="comment-submit">등록</button>
        </div>
      </div>
    </main>

    <!-- 게시글 수정 모달 -->
    <div id="editModal" class="modal-overlay" style="display: none">
      <div class="modal">
        <div class="modal-title">게시글 수정</div>
        <div class="form-group">
          <label class="form-label">제목</label>
          <input id="editTitle" class="form-input" placeholder="제목" />
        </div>
        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea
            id="editContent"
            class="form-textarea"
            placeholder="내용"
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">이미지</label>
          <div id="editDropZone" class="drop-zone drop-zone-sm">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span class="drop-zone-text">이미지 교체 (드래그 또는 클릭)</span>
            <input
              id="editImageInput"
              type="file"
              accept="image/*"
              style="display: none"
            />
          </div>
          <div
            id="editImagePreview"
            class="image-preview"
            style="display: none"
          >
            <img id="editPreviewImg" src="" alt="미리보기" />
            <button class="remove-img-btn" id="editRemoveImgBtn">✕</button>
          </div>
        </div>
        <div class="modal-btns">
          <button class="modal-cancel" id="editCancel">취소</button>
          <button class="modal-save" id="editSave">저장</button>
        </div>
      </div>
    </div>

    <!-- 댓글 수정 모달 -->
    <div id="commentEditModal" class="modal-overlay" style="display: none">
      <div class="modal modal-sm">
        <div class="modal-title">댓글 수정</div>
        <textarea
          id="commentEditInput"
          class="form-textarea"
          style="min-height: 80px"
        ></textarea>
        <div class="modal-btns">
          <button class="modal-cancel" id="commentEditCancel">취소</button>
          <button class="modal-save" id="commentEditSave">저장</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

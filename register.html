<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할래말래</title>
    <link rel="stylesheet" href="./register.css" />
  </head>
  <body>
    <div class="header">회원가입</div>

    <div class="container">
      <form action="">
        아이디 <input type="text" placeholder="" class="id" />

        비밀번호 <input type="password" placeholder="" class="pw" />

        비밀번호 확인 <input type="password" placeholder="" class="pw_check" />

        이메일 주소 <input type="email" placeholder="" class="email" />

        휴대전화 <input type="number" placeholder="" class="tel" />

        이름 <input type="text" placeholder="" class="user_name" />

        닉네임 <input type="text" placeholder="" class="nickname" />

        생년월일 <input type="date" placeholder="" class="birth" />
      </form>
    </div>

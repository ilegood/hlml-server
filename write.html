<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 작성 — 할래말래</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <button class="back-btn" onclick="history.back()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        <div class="logo">글 작성</div>
        <div style="width: 36px"></div>
      </div>
    </header>
    <main class="container write-container">
      <div class="write-form">
        <div class="form-group">
          <label class="form-label">제목</label>
          <input
            id="titleInput"
            class="form-input"
            placeholder="제목을 입력하세요"
          />
        </div>
        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea
            id="contentInput"
            class="form-textarea"
            placeholder="어떤 활동을 함께 하고 싶나요?"
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">카테고리</label>
          <div id="writeTags" class="tag-filters"></div>
        </div>
        <div class="form-group">
          <label class="form-label">이미지 (선택)</label>
          <!-- 드래그 앤 드롭 영역 -->
          <div id="dropZone" class="drop-zone">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span class="drop-zone-text"
              >이미지를 드래그하거나 클릭해서 추가</span
            >
            <span class="drop-zone-sub">JPG, PNG, GIF, WEBP</span>
            <input
              id="imageInput"
              type="file"
              accept="image/*"
              style="display: none"
            />
          </div>
          <div id="imagePreview" class="image-preview" style="display: none">
            <img id="previewImg" src="" alt="미리보기" />
            <button class="remove-img-btn" id="removeImgBtn">✕</button>
          </div>
        </div>
        <button class="submit-btn" id="addBtn">등록하기</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
